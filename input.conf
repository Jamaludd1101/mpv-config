# ==========  PROFIL SWITCHING ==========
CTRL+1 apply-profile anime      ; show-text "Mode Anime aktif (FSRCNNX + downscale)"
CTRL+2 apply-profile film       ; show-text "Mode Film aktif (ArtCNN)"
CTRL+3 apply-profile default-video ; show-text "Mode Hemat Daya aktif"
CTRL+0 apply-profile reset      ; show-text "Reset ke pengaturan awal"

# ==========  TOGGLE DEBAND ==========
b cycle deband ; show-text "Debanding: ${deband}"

# ==========  STATISTIK & SHADER INFO ==========
i script-binding stats/display-stats-toggle
2 script-binding stats/display-page-2 ; show-text "Halaman Analisis Shader"

# ==========  KONTROL UMUM ==========
k cycle ontop
d cycle deband
D cycle deinterlace
n cycle video-unscaled
C cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"

a cycle audio
A cycle audio down
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
UP add volume 2
DOWN add volume -2
x add audio-delay -0.05
X add audio-delay +0.05

F11 playlist-prev
F12 playlist-next


Shift+g add sub-scale +0.05
Shift+f add sub-scale -0.05
E add sub-gauss +0.1
R add sub-gauss -0.1
z add sub-delay -0.05
Z add sub-delay +0.05
u cycle sub-gray
U cycle blend-subtitles
p cycle sub-fix-timing
g sub-reload
l cycle-values sub-ass-override "yes" "force" "no"

# ==========  SCRIPT EKSTRA (jika diinstall) ==========
# Untuk membuat GIF (mpv-gif.lua)
b script-binding set_gif_start
B script-binding set_gif_end
ctrl+b script-binding make_gif
ctrl+B script-binding make_gif_with_subtitles

Ctrl+o script-binding open_file_dialog
Ctrl+Shift+O script-binding open_folder_dialog

# Copy timestamp

# Seek ke timestamp dari clipboard (seek-to.lua)
ctrl+S script-binding toggle-seeker
ctrl+v script-binding paste-timestamp

# Sponsorblock (sponsorblock-minimal.lua)
alt+b script-binding sponsorblock