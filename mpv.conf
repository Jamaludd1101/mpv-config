
# ==========  GENERAL  ==========
profile=high-quality
vo=gpu-next
priority=high
gpu-api=vulkan # Vulkan umumnya lebih cepat, jika ada masalah ganti d3d11
hwdec=auto-safe # Hardware decoding via Vulkan (gunakan iGPU untuk decode)
fullscreen=yes
taskbar-progress=no
force-seekable=yes
keep-open=always
reset-on-next-file=pause
dither-depth=auto # Deteksi otomatis kedalaman monitor (8-bit)
scale-antiring=0.6
gpu-shader-cache-dir=~~/shaders/cache

# ==========  SCALING (default) ==========
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
linear-upscaling=yes
sigmoid-upscaling=yes

# ==========  DEBAND (default mati, bisa diaktifkan via tombol) ==========
deband-iterations=2
deband-threshold=64
deband-range=17
deband-grain=12

# ==========  OSD & OSC ==========
osd-bar=no
osc=no
cursor-autohide-fs-only=yes
cursor-autohide=300
osd-level=1
osd-duration=1000
hr-seek=yes
osd-font=Verdana
osd-font-size=20
osd-color='#FFFFFF'
osd-border-color='#000000'
osd-border-size=0.6
osd-blur=0.2

# ==========  LANGUAGE ==========
alang=ja,jp,jpn,en,eng,id
slang=en,eng,id

# ==========  AUDIO ==========
volume=100
volume-max=150
audio-file-auto=fuzzy
audio-pitch-correction=yes

# ==========  SUBTITLES ==========
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=no
sub-auto=all
sub-font=Netflix Sans Medium
sub-font-size=40
sub-color='#FFFFFFFF'
sub-border-color='#FF000000'
sub-border-size=2.0
sub-shadow-offset=0
sub-spacing=0.0

# ==========  SCREENSHOT ==========
screenshot-format=png
screenshot-png-compression=1
screenshot-directory=~~/Pictures/mpv-screenshots
screenshot-template='%f-%wH.%wM.%wS.%wT-#%#00n'

# ==========  CACHE (opsional untuk streaming) ==========
cache=yes
cache-on-disk=no # Set yes jika sering streaming video besar
demuxer-max-bytes=500MiB
demuxer-readahead-secs=60
# log-file="~~/mpv.log"
# msg-level=all=trace

# ==========  PROFIL KHUSUS ==========
# Memuat semua video di folder yang sama sebagai playlist
autocreate-playlist=same
directory-mode=ignore
keep-open=yes
# --- Mode Anime (720p → 4K-like) ---

[anime]
profile-desc=Mode Anime: FSRCNNX 2x + SSimDownscaler + KrigBilateral + Adaptive Sharpen
glsl-shaders-clr=yes
# --- Tahap 1: Chroma Upscale ---
glsl-shader=~~/shaders/KrigBilateral.glsl
# --- Tahap 2: Luma Upscale 2x (720p -> 1440p) ---
glsl-shader=~~/shaders/FSRCNNX_x2_8-0-4-1.glsl
# --- Tahap 3: Koreksi dan Downscale Berkualitas (1440p -> 1080p) ---     # <-- TAMBAHKAN INI: Mengoreksi artifact upscale dan mengembalikan ketajaman alami [citation:10]'
glsl-shader=~~/shaders/SSimDownscaler.glsl
# --- Tahap 4: Penajaman Akhir (Opsional, bisa disesuaikan) ---
glsl-shader=~~/shaders/adaptive-sharpen.glsl   # <-- TAMBAHKAN INI: Memberi kesan tajam tanpa berlebihan [citation:1][citation:9]'

deband=yes
deband-iterations=2
deband-threshold=30
deband-range=15
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
linear-upscaling=yes
sigmoid-upscaling=yes

[film]
profile-desc=Mode Film: ArtCNN + SSimSuperRes + Natural Grain
glsl-shaders-clr=yes
# --- Tahap 1: Chroma Upscale ---
glsl-shader=~~/shaders/KrigBilateral.glsl
# --- Tahap 2: Neural Network untuk Detail Film ---
glsl-shader=~~/shaders/ArtCNN_C4F16.glsl
# --- Tahap 3: Koreksi dan Pemulihan Tekstur ---
glsl-shader=~~/shaders/SSimSuperRes.glsl        # <-- TAMBAHKAN INI'
# --- Tahap 4: Downscale Akhir (jika perlu) ---
glsl-shader=~~/shaders/SSimDownscaler.glsl

deband=yes
deband-iterations=1
deband-threshold=20
deband-range=10
scale=ewa_lanczossharp
cscale=mitchell
linear-downscaling=yes
sigmoid-upscaling=yes

[default-video]
profile-desc=Mode Hemat: tanpa shader, deband ringan
glsl-shaders-clr=yes
interpolation=no
video-sync=audio
deband=yes
deband-iterations=1
scale=bilinear
cscale=bilinear
dither-depth=auto

[reset]
profile-desc=Reset ke pengaturan awal
glsl-shaders-clr=yes
deband=yes
deband-iterations=2
deband-threshold=64
deband-range=17
deband-grain=12
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
linear-upscaling=no # Matikan untuk konsistensi
sigmoid-upscaling=no
interpolation=no
video-sync=audio

[WEB-DL]
profile-cond='string.match(p.filename, "HatSubs")~=nil or string.match(p.filename, "SubsPlease")~=nil or string.match(p.filename, "HorribleSubs")~=nil or string.match(p.filename, "Erai%-raws")~=nil'
deband=yes
